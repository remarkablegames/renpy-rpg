name: release-please
on:
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release

  itch:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.release_created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ren'Py
        uses: remarkablegames/setup-renpy@v2
        with:
          web: true

      - name: Delete unnecessary files
        run: >
          find . -type f
          ! -name 'icon.*'
          ! -name 'progressive_download.txt'
          ! -name 'version.txt'
          ! -name 'web-*'
          ! -path '*/.*'
          ! -path './game/*'
          -delete

      - name: Build packages
        run: renpy-launcher distribute . --dest ../dists

      # e.g., "../dists/renpy-template-1.2.3-linux.tar.bz2" -> "../dists/linux.tar.bz2"
      - name: Rename packages
        run: |
          for filename in ../dists/*; do
            mv -- "$filename" "../dists/${filename##*-}"
          done

      - name: Build web
        run: renpy-launcher web_build . --destination ../dists/web

      - name: Setup butler
        uses: remarkablegames/setup-butler@v3

      # https://www.renpy.org/doc/html/build.html#var-build.itch_channels
      - name: Upload to itch.io
        run: |
          for i in "web web" "linux.tar.bz2 linux" "mac.zip osx" "market.zip win-osx-linux" "pc.zip win-linux" "win.zip win"
          do
            set -- $i
            butler push ../dists/$1 ${{ github.repository }}:$2 --userversion-file version.txt
          done
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}

      - name: Upload Release Artifact
        run: >
          gh release upload
          ${{ needs.release.outputs.tag_name }}
          ../dists/*.zip
          ../dists/*.tar.bz2
        env:
          GH_TOKEN: ${{ github.token }}

  wavedash:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ needs.release.outputs.release_created }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Ren'Py
        uses: remarkablegames/setup-renpy@v2
        with:
          web: true

      - name: Delete unnecessary files
        run: >
          find . -type f
          ! -name 'icon.*'
          ! -name 'progressive_download.txt'
          ! -name 'version.txt'
          ! -name 'web-*'
          ! -path '*/.*'
          ! -path './game/*'
          -delete

      - name: Build web
        run: renpy-launcher web_build . --destination dist

      - name: Upload to Wavedash
        uses: remarkablegames/wavedash-action@v1
        with:
          token: ${{ secrets.WAVEDASH_TOKEN }}
          game-id: ${{ secrets.WAVEDASH_GAME_ID }}
          build-message: ${{ needs.release.outputs.tag_name }}
